<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accessibility Fixes</title></head>
<body>
<h1>Accessibility Fixes</h1>
<!-- Replaced div button with native button: keyboard and screen-reader support. -->
<button type="button">Continue</button>
<!-- Added a real label: screen readers can identify the input. -->
<label for="customer-name">Customer name</label>
<input id="customer-name" name="customer-name" type="text" required>
<!-- Added meaningful alt text: communicates the image meaning. -->
<img src="teff.jpg" alt="Teff grain ready for sale" width="300" height="200">
</body>
</html>
