<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethio Telecom Registration</title>
<meta name="description" content="Register for a fictional Ethio Telecom service.">
</head>
<body>
<header><h1>Ethio Telecom Service Registration</h1></header>
<main>
<!-- POST is used because registration changes server-side data. -->
<form action="/register" method="post">
<fieldset>
<legend>Create your account</legend>
<label for="fullname">Full name</label>
<input id="fullname" name="fullname" type="text" required>
<br><br>
<label for="email">Email</label>
<input id="email" name="email" type="email" required>
<br><br>
<label for="phone">Phone</label>
<input id="phone" name="phone" type="tel" pattern="\+251[0-9]{9}" aria-describedby="phone-help" required>
<p id="phone-help">Format: +251 followed by 9 digits.</p>
<label for="branch">Preferred branch</label>
<select id="branch" name="branch" required>
<option value="">Select a branch</option>
<option>Bole</option><option>Kazanchis</option><option>Piassa</option>
</select>
<br><br>
<button type="submit">Register</button>
</fieldset>
</form>
</main>
</body>
</html>
