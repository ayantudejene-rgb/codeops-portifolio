<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            padding: 0 20px;
            background: #1B4D8E;
            color: white;
            font-family: system-ui, sans-serif;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right a {
            color: white;
            text-decoration: none;
        }

        .nav-right button {
            background: #D4A027;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Logo</div>
        <div class="nav-right">
            <a href="#">Link 1</a>
            <a href="#">Link 2</a>
            <a href="#">Link 3</a>
            <button>Button</button>
        </div>
    </nav>
</body>
</html>
