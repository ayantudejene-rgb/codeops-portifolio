<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
    <style>
        .card {
            width: 300px;
            padding: 24px;
            border: 2px solid #1B4D8E;
            background: #f0f6ff;
            margin-bottom: 20px;
        }

        .card.content-box {
            box-sizing: content-box;
            /* total width = 300 + 48 + 4 = 352px */
            border-color: #b45309;
            background: #fff6e5;
        }

        .card.border-box {
            box-sizing: border-box;
            /* total width exactly 300px */
            border-color: #1B4D8E;
            background: #e6f0fa;
        }
    </style>
</head>
<body>
    <div class="card content-box">
        <strong>content-box</strong><br>
        Rendered width: 352px (300 + 48 + 4)
    </div>
    <div class="card border-box">
        <strong>border-box</strong><br>
        Rendered width: exactly 300px ✓
    </div>
</body>
</html>
