<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <style>
        .product-card {
            position: relative;
            width: 260px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: system-ui, sans-serif;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #B33B3B;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            text-align: center;
            line-height: 1.2;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .product-card h3 {
            margin: 0 0 6px 0;
        }
        .product-card p {
            color: #555;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="badge">ETB<br>Sale</div>
        <h3>ጥሩ ምርት</h3>
        <p>ETB 1,200</p>
    </div>
</body>
</html>
