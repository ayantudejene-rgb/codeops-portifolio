<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
    <style>
        p {
            color: #1e293b;
        }

        .note {
            color: #2563eb;
        }

        #lead {
            color: #16a34a;
        }
    </style>
</head>
<body>
    <p id="lead" class="note">
        This paragraph has an element, a class, and an ID.
    </p>
    <p><strong>Winner: green (#16a34a)</strong> — the ID selector wins because (0,1,0,0) beats (0,0,1,0) and (0,0,0,1).</p>
</body>
</html>
