<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Habesha Eatery, Bole</title>
<meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa.">
</head>
<body>
<header><h1>Contact Habesha Eatery</h1></header>
<nav aria-label="Main navigation"><a href="index.html">Reservations</a> <a href="contact.html">Contact</a></nav>
<main>
<section><h2>Send Us a Message</h2>
<form action="/contact" method="post">
<label for="name">Name</label><input id="name" name="name" type="text" required><br><br>
<label for="email">Email</label><input id="email" name="email" type="email" required><br><br>
<label for="message">Message</label><textarea id="message" name="message" rows="6" cols="40" required></textarea><br><br>
<button type="submit">Send Message</button>
</form>
</section>
<section><h2>Opening Hours</h2>
<table><caption>Habesha Eatery opening hours</caption>
<thead><tr><th scope="col">Day</th><th scope="col">Hours</th></tr></thead>
<tbody>
<tr><th scope="row">Monday</th><td>10:00–22:00</td></tr><tr><th scope="row">Tuesday</th><td>10:00–22:00</td></tr>
<tr><th scope="row">Wednesday</th><td>10:00–22:00</td></tr><tr><th scope="row">Thursday</th><td>10:00–22:00</td></tr>
<tr><th scope="row">Friday</th><td>10:00–23:00</td></tr><tr><th scope="row">Saturday</th><td>10:00–23:00</td></tr>
<tr><th scope="row">Sunday</th><td>10:00–21:00</td></tr>
</tbody></table>
</section>
</main>
<footer><p>Bole, Addis Ababa</p></footer>
</body>
</html>
