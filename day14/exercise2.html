<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
    <style>
        .card-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 20px auto;
        }

        .card {
            flex: 1;
            min-width: 120px;
            background: #f0f6ff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card-row">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
    </div>
    <p style="font-family:system-ui; text-align:center;">Resize the window – cards wrap when they run out of space.</p>
</body>
</html>
