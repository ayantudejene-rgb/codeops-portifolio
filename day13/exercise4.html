<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>
    <style>
        table {
            width: 100%;
            max-width: 700px;
            border-collapse: collapse;
            font-family: system-ui, sans-serif;
        }

        thead {
            background: #1B4D8E;
            color: white;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr:nth-child(even) {
            background: #f1f6fa;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Flight</th>
                <th>Route</th>
                <th>Departure</th>
                <th>Arrival</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>ET 512</td><td>Addis → Nairobi</td><td>08:30</td><td>10:45</td></tr>
            <tr><td>ET 728</td><td>Addis → Dubai</td><td>11:15</td><td>16:20</td></tr>
            <tr><td>ET 203</td><td>Addis → Lagos</td><td>14:00</td><td>17:30</td></tr>
            <tr><td>ET 891</td><td>Addis → London</td><td>22:45</td><td>05:10</td></tr>
            <tr><td>ET 407</td><td>Addis → Cape Town</td><td>09:20</td><td>13:55</td></tr>
        </tbody>
    </table>
</body>
</html>
